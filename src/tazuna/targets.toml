# Built-in render targets: where the project policy (PROJECT.md) is rendered to.
# Each target may declare:
#   path        output path relative to the project root
#   frontmatter text placed before the generated marker (Cursor rules need YAML frontmatter)
#   appendix    default appendix file (relative to project root) appended after the policy
#   max_bytes   optional: the harness stops reading past this size; `render --check` fails and
#               `doctor` warns when the rendered file is larger (it is still written)
#   import_of   optional: instead of a copy of the policy, write one `@<path>` line that imports the
#               named target's file (the appendix is still appended). That target must be enabled.
# Packs and tazuna.toml can add targets or override these tables.

[targets.claude]
description = "Claude Code, with its own copy of the policy"
path = "CLAUDE.md"
appendix = ".tazuna/appendix/claude.md"

# Claude Code reads CLAUDE.md; whether it also reads AGENTS.md depends on its version and settings.
# An `@AGENTS.md` import is read exactly once either way, so Claude, Codex and Cursor (which reads
# AGENTS.md itself) all see one copy of the policy.
[targets.claude-shim]
description = "Claude Code, importing AGENTS.md (needs the codex target)"
path = "CLAUDE.md"
import_of = "codex"
appendix = ".tazuna/appendix/claude.md"

[targets.codex]
description = "OpenAI Codex and any AGENTS.md-aware agent"
path = "AGENTS.md"
appendix = ".tazuna/appendix/codex.md"
# Codex CLI reads at most project_doc_max_bytes of AGENTS.md (32768 in 0.153.4) and drops the rest.
max_bytes = 32768

[targets.cursor]
description = "Cursor project rule"
path = ".cursor/rules/project.mdc"
frontmatter = "---\ndescription: Project contract (generated from PROJECT.md)\nalwaysApply: true\n---\n"
appendix = ".tazuna/appendix/cursor.md"

[targets.gemini]
description = "Gemini CLI"
path = "GEMINI.md"
appendix = ".tazuna/appendix/gemini.md"

[targets.copilot]
description = "GitHub Copilot (instructions only)"
path = ".github/copilot-instructions.md"
appendix = ".tazuna/appendix/copilot.md"

[targets.windsurf]
description = "Windsurf"
path = ".windsurfrules"
appendix = ".tazuna/appendix/windsurf.md"

[targets.cline]
description = "Cline"
path = ".clinerules"
appendix = ".tazuna/appendix/cline.md"
