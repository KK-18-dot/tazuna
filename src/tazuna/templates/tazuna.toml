# tazuna.toml — project configuration for tazuna.
# Docs: docs/configuration.md. Personal provider choices belong in
# ~/.config/tazuna/config.toml (same format), not in the repository.

[project]
name = "{{name}}"
policy = "PROJECT.md"          # single source rendered into every target below

[render]
# The policy is written once, to AGENTS.md (codex; Cursor and other AGENTS.md-aware agents read it
# too), and CLAUDE.md only imports it. Other built-in targets: claude (a full copy for Claude
# Code), cursor (a .cursor/rules copy), gemini, copilot, windsurf, cline.
targets = ["claude-shim", "codex"]

[models]
# Aliases used by roles and by {{model:ALIAS}} tokens inside PROJECT.md.
# Values are literal model ids for the provider that will run them. The ids below are EXAMPLES:
# which ids you can use depends on your plan with each provider (subscription CLI login or API
# billing). Replace them with ids your plan enables, or override them in
# ~/.config/tazuna/config.toml so the repository stays plan-neutral.
fast = "claude-sonnet-5"
strong = "claude-opus-5"
codex_default = "gpt-5.6-luna"
local = "gemma4:e2b"
{{models_extra}}# Model ids that must not reappear in [models] or in rendered files. `tazuna doctor` checks.
retired = []

# Roles are the unit of routing: `tazuna run --role NAME "task"`.
# provider = a built-in or user-defined provider; model = alias from [models] or a literal id;
# effort must be one the provider supports; read_only = never let the provider modify files;
# fallback = role retried once when the provider reports quota exhaustion or a missing login.
# `tazuna routes` shows what each role resolves to and whether its provider is installed.
{{roles}}
[run]
timeout = 900            # default seconds when a role has no timeout
min_output_bytes = 40    # exit 0 with less output than this is reported as exit 4 (empty output)
max_depth = 2            # a delegated provider may delegate once more, never deeper
env_extra = []           # extra environment variable names forwarded to providers (no secrets)

[packs]
paths = []               # directories containing pack.toml
